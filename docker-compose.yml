version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trade-points-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_points_system
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trade-points-network

  # to uncomment when ready to run the API service
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: trade-points-api
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: development
  #     PORT: 3000
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USERNAME: postgres
  #     DB_PASSWORD: postgres
  #     DB_DATABASE: trade_points_system
  #     JWT_SECRET: your_jwt_secret_key
  #     JWT_EXPIRATION: 1d
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - trade-points-network

networks:
  trade-points-network:
    driver: bridge

volumes:
  postgres_data:
